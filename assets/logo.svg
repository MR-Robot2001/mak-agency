<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="qBlueGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="qSlateGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="qGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer precision geometric ring -->
  <circle cx="50" cy="50" r="40" stroke="url(#qSlateGrad)" stroke-width="2.5" stroke-dasharray="180 15 50 15" stroke-linecap="round" opacity="0.6" />
  
  <!-- Main sculpted Q Ring -->
  <circle cx="50" cy="50" r="32" stroke="url(#qBlueGrad)" stroke-width="5" stroke-linecap="round" filter="url(#qGlow)" stroke-dasharray="170 35" />
  
  <!-- Core Inner Geometric Iris -->
  <circle cx="50" cy="50" r="18" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="4 6" />
  
  <!-- Sovereign Division Tail / Slash (Quantile Vector) -->
  <line x1="42" y1="42" x2="78" y2="78" stroke="url(#qBlueGrad)" stroke-width="5.5" stroke-linecap="round" filter="url(#qGlow)" />
  <circle cx="78" cy="78" r="3.5" fill="#3B82F6" />
  
  <!-- Precision Vertex Points -->
  <circle cx="50" cy="18" r="2.5" fill="#2563EB" />
  <circle cx="18" cy="50" r="2.5" fill="#2563EB" />
</svg>
